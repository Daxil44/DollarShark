# ─────────────────────────────────────────────────────────────────────────────
# DollarShark CD (Continuous Deployment)
#
# After CI passes on main (i.e. a PR was merged), this workflow:
#   1. builds the three Docker images on GitHub's fast machines,
#   2. pushes them to GitHub's container registry (ghcr.io), tagged with the commit id,
#   3. SSHes into the Lightsail server and runs deploy.sh, which pulls the images,
#      restarts the app, checks /health, and rolls back automatically if it's unhealthy.
#
# One-time setup (secrets, SSH key): docs/deployment.md § 8.
# ─────────────────────────────────────────────────────────────────────────────
name: Deploy

on:
  workflow_run:
    workflows: [CI]          # wait for the CI workflow…
    types: [completed]
    branches: [main]         # …on main only
  workflow_dispatch:         # "Run workflow" button: redeploy main by hand

# Never run two deploys at the same time; a newer one waits for the older one to finish.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write            # push images to ghcr.io

env:
  IMAGE_PREFIX: ghcr.io/daxil44/dollarshark   # must be lowercase
  # The commit CI tested (workflow_run), or the newest main commit (manual run).
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  build:
    name: Build ${{ matrix.image }} image
    # Only if CI passed (a manual run skips this check).
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - image: api
            context: backend
          - image: web
            context: frontend
          - image: backup
            context: backup
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}

      - name: Log in to GitHub container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Short commit id
        id: ids
        run: echo "short=${SHA::7}" >> "$GITHUB_OUTPUT"

      # Tags: full commit id, short commit id (what you type to roll back), and "latest".
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}:${{ env.SHA }}
            ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}:${{ steps.ids.outputs.short }}
            ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SHA }}
          # Reuse layers from earlier runs, so unchanged parts aren't rebuilt.
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    name: Deploy to Lightsail
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://dollarshark.ca
    steps:
      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          # The key may be pasted as ONE base64 line (easiest to copy: `base64 -w0 ~/github-deploy`)
          # or as the usual BEGIN/END block. Copying from a browser terminal can add spaces, Windows line
          # endings or join the lines, so rebuild the block cleanly either way.
          raw=$(printf '%s' "$DEPLOY_SSH_KEY" | tr -d '\r')
          if printf '%s' "$raw" | grep -q 'BEGIN OPENSSH PRIVATE KEY'; then
            body=$(printf '%s' "$raw" | sed 's/-----BEGIN OPENSSH PRIVATE KEY-----//; s/-----END OPENSSH PRIVATE KEY-----//' | tr -d '[:space:]')
            {
              echo '-----BEGIN OPENSSH PRIVATE KEY-----'
              printf '%s\n' "$body" | fold -w 70
              echo '-----END OPENSSH PRIVATE KEY-----'
            } > ~/.ssh/deploy_key
          else
            printf '%s' "$raw" | tr -d '[:space:]' | base64 -d > ~/.ssh/deploy_key 2>/dev/null || true
          fi
          chmod 600 ~/.ssh/deploy_key
          if ! ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null 2>&1; then
            echo "::error::The DEPLOY_SSH_KEY secret is not a valid private key (damaged when copied?). Paste the output of: base64 -w0 ~/github-deploy"
            exit 1
          fi
          # Safe to show: compare it with `ssh-keygen -lf ~/.ssh/authorized_keys` on the server.
          echo "Deploy key fingerprint: $(ssh-keygen -lf ~/.ssh/deploy_key | awk '{print $2}')"
          # The server's public host key: proves we're talking to OUR server, not an impostor.
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" | tr -d '\r' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' > ~/.ssh/known_hosts

      # The deploy key can only run "git pull && sh deploy.sh" on the server. The text after the host is the build to deploy;
      # the registry login (valid only while this job runs) goes over standard input, never on a command line.
      - name: Run deploy.sh on the server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHORT_SHA="${SHA::7}"
          rc=0
          printf '%s\n%s\n' "$REGISTRY_USER" "$REGISTRY_TOKEN" |
            ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
              "ubuntu@$(printf '%s' "$DEPLOY_HOST" | tr -d '[:space:]')" "$SHORT_SHA" || rc=$?
          if [ "$rc" -eq 255 ]; then
            echo "::error::Could not log in to the server over SSH (see the message above). 'Host key verification failed' → check DEPLOY_KNOWN_HOSTS; 'Permission denied (publickey)' → the deploy key is not in the server's ~/.ssh/authorized_keys."
          fi
          exit "$rc"

      - name: Check the live site
        run: |
          for _ in 1 2 3 4 5 6; do
            if curl -fsS https://dollarshark.ca/health | grep -q healthy; then echo "https://dollarshark.ca is healthy"; exit 0; fi
            sleep 10
          done
          echo "The live site did not answer /health"; exit 1

      - name: Remove the SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key

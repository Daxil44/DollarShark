# DollarShark: the whole app in one command.
#   1. cp .env.example .env   and fill it in
#   2. docker compose up -d --build
# Services: db (PostgreSQL, private) · api (ASP.NET Core) · web (React + Caddy, the only public one) · backup (nightly, encrypted)
name: dollarshark

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: dollarshark
      POSTGRES_USER: dollarshark
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    # No "ports:" on purpose — the database is reachable only by the api container, never from the internet.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dollarshark -d dollarshark"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  api:
    # On the server, deploy.sh pulls this image from GitHub's registry (built by .github/workflows/deploy.yml).
    # Locally, "docker compose up --build" builds it from ./backend instead.
    image: ${IMAGE_PREFIX:-ghcr.io/daxil44/dollarshark}-api:${IMAGE_TAG:-latest}
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__FinanceDb: "Host=db;Port=5432;Database=dollarshark;Username=dollarshark;Password=${DB_PASSWORD};GSS Encryption Mode=Disable"
      Database__MigrateOnStartup: "true"
      FrontendOrigin: ${SITE_URL:?Set SITE_URL in .env}
      DataProtection__KeysPath: /app/keys
      StatementStorage__RootPath: /app/statements
      ReverseProxy__KnownNetworks__0: 172.16.0.0/12
      Https__Redirect: ${HTTPS_REDIRECT:-true}
      Https__SecureCookies: ${HTTPS_REDIRECT:-true}   # false ONLY for local http testing
      Email__Provider: Smtp
      Email__Smtp__Host: ${SMTP_HOST:?Set SMTP_HOST in .env}
      Email__Smtp__Port: ${SMTP_PORT:-587}
      Email__Smtp__EnableSsl: ${SMTP_ENABLE_SSL:-true}
      Email__Smtp__Username: ${SMTP_USERNAME:-}
      Email__Smtp__Password: ${SMTP_PASSWORD:-}
      Email__FromAddress: ${SMTP_FROM:?Set SMTP_FROM in .env}
      Authentication__Google__ClientId: ${GOOGLE_CLIENT_ID:-}
      Authentication__Google__ClientSecret: ${GOOGLE_CLIENT_SECRET:-}
    volumes:
      - api-keys:/app/keys
      - api-statements:/app/statements

  web:
    image: ${IMAGE_PREFIX:-ghcr.io/daxil44/dollarshark}-web:${IMAGE_TAG:-latest}
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - api
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - caddy-data:/data      # HTTPS certificates — keep this volume!
      - caddy-config:/config

  # Nightly encrypted backups of the database + statement files (to the "backups" volume and, if configured, S3).
  # Restore tools: docker compose exec backup restore.sh   (see docs/deployment.md → Backups)
  backup:
    image: ${IMAGE_PREFIX:-ghcr.io/daxil44/dollarshark}-backup:${IMAGE_TAG:-latest}
    build: ./backup
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: dollarshark
      PGPASSWORD: ${DB_PASSWORD}
      PGDATABASE: dollarshark
      PGGSSENCMODE: disable
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:-}
      BACKUP_TIME_UTC: ${BACKUP_TIME_UTC:-08:00}
      BACKUP_KEEP_LOCAL: ${BACKUP_KEEP_LOCAL:-7}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      AWS_ACCESS_KEY_ID: ${BACKUP_AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${BACKUP_AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${BACKUP_AWS_REGION:-us-east-2}
    volumes:
      - backups:/backups
      - api-statements:/statements
    # "unhealthy" in `docker compose ps` = no successful backup in the last 26 hours → check `docker compose logs backup`
    healthcheck:
      test: ["CMD-SHELL", "test $$(( $$(date +%s) - $$(cat /backups/.last-success 2>/dev/null || echo 0) )) -lt 93600"]
      interval: 10m
      timeout: 10s
      start_period: 5m

  # Local testing only (docker compose --profile local up): catches all emails in a web inbox at http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    profiles: [local]
    restart: unless-stopped
    ports:
      - "8025:8025"

volumes:
  db-data:
  api-keys:
  api-statements:
  caddy-data:
  caddy-config:
  backups:

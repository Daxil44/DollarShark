# DollarShark: the whole app in one command.
#   1. cp .env.example .env   and fill it in
#   2. docker compose up -d --build
# Services: db (SQL Server Express, private) · api (ASP.NET Core) · web (React + Caddy, the only public one)
name: dollarshark

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - db-data:/var/opt/mssql
    # No "ports:" on purpose — the database is reachable only by the api container, never from the internet.
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -b -Q 'SELECT 1' -o /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 120s

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__FinanceDb: "Server=db;Database=DollarShark;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True;Encrypt=True"
      Database__MigrateOnStartup: "true"
      FrontendOrigin: ${SITE_URL:?Set SITE_URL in .env}
      DataProtection__KeysPath: /app/keys
      StatementStorage__RootPath: /app/statements
      ReverseProxy__KnownNetworks__0: 172.16.0.0/12
      Https__Redirect: ${HTTPS_REDIRECT:-true}
      Https__SecureCookies: ${HTTPS_REDIRECT:-true}   # false ONLY for local http testing
      Email__Provider: Smtp
      Email__Smtp__Host: ${SMTP_HOST:?Set SMTP_HOST in .env}
      Email__Smtp__Port: ${SMTP_PORT:-587}
      Email__Smtp__EnableSsl: ${SMTP_ENABLE_SSL:-true}
      Email__Smtp__Username: ${SMTP_USERNAME:-}
      Email__Smtp__Password: ${SMTP_PASSWORD:-}
      Email__FromAddress: ${SMTP_FROM:?Set SMTP_FROM in .env}
      Authentication__Google__ClientId: ${GOOGLE_CLIENT_ID:-}
      Authentication__Google__ClientSecret: ${GOOGLE_CLIENT_SECRET:-}
    volumes:
      - api-keys:/app/keys
      - api-statements:/app/statements

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - api
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - caddy-data:/data      # HTTPS certificates — keep this volume!
      - caddy-config:/config

  # Local testing only (docker compose --profile local up): catches all emails in a web inbox at http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    profiles: [local]
    restart: unless-stopped
    ports:
      - "8025:8025"

volumes:
  db-data:
  api-keys:
  api-statements:
  caddy-data:
  caddy-config:
